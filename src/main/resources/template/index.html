
<!DOCTYPE html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

<main class="container">

    <!-- TASK 1: Website heading -->


    <!-- TASK 2: City search -->

    <input
            type="text"
            id="cityInput"
            placeholder="Enter city"
    >

    <button id="searchButton">
        Search
    </button>


    <!-- TASK 3: Loading and error messages -->

    <p id="message"></p>


    <!-- TASK 4: Weather results -->

    <section id="weatherResult" hidden>

        <h2 id="cityName"></h2>

        <h1 id="temperature"></h1>

        <p id="condition"></p>

        <p id="humidity"></p>

        <p id="wind"></p>

    </section>

</main>
